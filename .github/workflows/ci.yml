name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
  actions: read
jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@a543ccfa7fa7b0e1af71a621cfa2e8fa52df7fae
    with:
      breaking-change-bump: minor
      crate-name: tokio-token-bucket
      kind: library
    secrets: inherit
