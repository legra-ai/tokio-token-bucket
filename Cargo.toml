[package]
name = "tokio-token-bucket"
version = "0.1.0"
description = "Bounded asynchronous rate limiting for Tokio tasks"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/tokio-token-bucket"
documentation = "https://docs.rs/tokio-token-bucket"
readme = "README.md"
build = "build.rs"
keywords = ["tokio", "async", "rate-limit", "throttle", "backpressure"]
categories = ["asynchronous", "concurrency"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "src/**/*.rs",
]

[dependencies]
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "test-util", "time"] }

[build-dependencies]
rhusky = "0.0.6"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
# `large_futures` computes the layout of every async opaque type; on current
# nightlies that hits a rustc ICE ("unexpected rigid alias in layout_of after
# normalization"). Stable passes clean. Re-enable once the compiler is fixed.
large_futures = "allow"

all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
